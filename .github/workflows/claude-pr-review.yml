name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(grep:*),Bash(find:*),Bash(cat:*),Bash(ls:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(awk:*),Bash(sed:*),mcp__github__*"'
          prompt: |
            Du reviewst einen PR für wolffiles-app: Laravel 12 / Filament 3 / PHP 8.3 / MariaDB / Redis.
            Stack-Kontext: läuft auf AlmaLinux 9 mit Plesk + Apache + PHP-FPM.

            Wichtig: Wir hatten folgende Bug-Klassen - schau besonders danach:

            1. CWD-abhängiger Code in Shell-Exec-Calls. Beispiel: exec('unrar p ...') schreibt in CWD,
               und PHP-FPM-Worker haben CWD=public/. Files leakten nach public/.

            2. unrar-free 0.1.1 Bugs: dessen 'p' (print) Mode hat einen CWD-Write Side-Effect.
               Generell exec-Calls die externe Tools mit relativen Pfaden aufrufen sind verdächtig.

            3. Filament-Routen: route('filament.admin.resources.X.edit', $model) braucht ['record' => $model->slug],
               sonst nutzt Filament die ID statt slug.

            4. Race Conditions bei concurrent Updates: tracker_servers Deadlocks waren ein Problem.
               Multi-Step DB-Ops sollten in Transactions sein.

            5. Observer/Notification-Logik: TelegramObserver hatte status==='pending' und vergaß
               approved/transition-Fälle.

            6. Path Traversal in File-Uploads/Storage.

            7. N+1 Queries in Listing-Views.

            8. Fehlende Error-Handling bei externen Services (S3, Redis, GitHub, Mistral, Telegram, Discord).

            9. Mass Assignment ohne $fillable.

            10. Hardcoded URLs (besonders wolffiles.wahke.dev — die existiert nicht mehr, immer wolffiles.eu).

            Severities:
            - Critical (Security/Data Loss): markiere mit 🔴, BLOCKE wenn möglich
            - High (echter Bug): 🟠
            - Medium (best practice): 🟡 inline comment
            - Low/Style: skip ganz

            Keine Stil-Diskussion. Nur substanzielle Findings. Bei sauberem PR: kurzer positiver Comment.
